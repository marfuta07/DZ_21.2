{% extends "base.html" %}

{% block title %}Категория 1 - Магазин{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="display-4 text-primary">Категория 1</h1>
        <hr class="my-4">
    </div>
</div>

<div class="row">
    {% for i in range(4) %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Товар 1</h5>
                <h3 class="text-primary font-weight-bold">$100</h3>
                <ul class="list-unstyled">
                    <li><i class="fas fa-check-circle text-success mr-2"></i>10 users included</li>
                    <li><i class="fas fa-check-circle text-success mr-2"></i>2 GB of storage</li>
                    <li><i class="fas fa-check-circle text-success mr-2"></i>Email support</li>
                    <li><i class="fas fa-check-circle text-success mr-2"></i>Help center access</li>
                </ul>
                <div class="mt-auto">
                    <a href="#" class="btn btn-primary btn-block buy-btn">
                        <i class="fas fa-shopping-cart mr-2"></i>Купить
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="d-flex justify-content-end mt-5 pt-3 border-top">
    <span class="text-secondary mr-3"><i class="fas fa-id-card mr-1"></i>Профиль</span>
    <span class="text-secondary mr-3"><i class="fas fa-sign-out-alt mr-1"></i>Выход</span>
    <span class="font-weight-bold text-primary"><i class="fas fa-user-circle mr-1"></i>Пользователь</span>
</div>
{% endblock %}
