<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- ЛЕВОЕ МЕНЮ -->
            <nav class="col-md-4 col-lg-3 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-4">
                    <h4 class="text-white text-center mb-4">
                        <i class="fas fa-store mr-2"></i>Магазин
                    </h4>

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/">
                                <i class="fas fa-home mr-3"></i>Главная
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/category">
                                <i class="fas fa-tag mr-3"></i>Категория 1
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/contacts">
                                <i class="fas fa-envelope mr-3"></i>Контакты
                            </a>
                        </li>
                    </ul>

                    <hr class="bg-secondary">

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white dropdown-toggle" href="#" data-toggle="dropdown">
                                <i class="fas fa-user-circle mr-3"></i>Пользователь
                            </a>
                            <div class="dropdown-menu">
                                <a class="dropdown-item" href="#">
                                    <i class="fas fa-id-card mr-2"></i>Профиль
                                </a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item text-danger" href="#">
                                    <i class="fas fa-sign-out-alt mr-2"></i>Выход
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- ОСНОВНОЙ КОНТЕНТ -->
            <main class="col-md-8 col-lg-9 ml-sm-auto px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- ФУТЕР -->
    <footer class="footer bg-light py-3 border-top">
        <div class="container text-center text-muted">
            <p class="mb-0">
                <i class="fas fa-copyright mr-1"></i>2026 Магазин. Все права защищены.
            </p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
